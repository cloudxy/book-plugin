schema_version: book-skill/1
authored_by: synthetic-fixture-author
book:
  id: thinking-book
  title: 渡口试验
  author: book-workflow 原创合成
  edition: 测试夹具第一版
  kind: argumentative
  description: Use the synthetic ferry framework to distinguish missing conditions
    from an already completed preparation, and explain the limits of a small test.
scope:
  coverage: synthetic-selected-system
  includes: 行动条件、有限检验及条件更新
  excludes: 真实航运、其他领域的技术程序及未给定事实
procedures:
  status: not_applicable
  reason: 本合成试验不含计算或操作程序。
concerns:
- id: V-action
  statement: 行动要有条件，也要在条件具备后承担。
  epistemic_status: reconstructed
  anchors:
  - BKE-conditions
  - BKE-update
  conditions: 仅适用本合成来源的有限条件判断
  speaker: 合成论说者
concepts:
- id: K-scope
  statement: 一次检验有有限范围。
  epistemic_status: reconstructed
  anchors:
  - BKE-scope
  conditions: 仅适用本合成来源的有限条件判断
  speaker: 合成论说者
claims:
- id: C-test
  statement: 不能由一次局部成功推出所有场景成功。
  epistemic_status: reconstructed
  anchors:
  - BKE-scope
  conditions: 仅适用本合成来源的有限条件判断
  speaker: 合成论说者
relations:
- id: R-scope
  statement: 检验范围限制成功结论范围。
  epistemic_status: reconstructed
  anchors:
  - BKE-scope
  conditions: 仅适用本合成来源的有限条件判断
  speaker: 合成论说者
  from: K-scope
  to: C-test
  type: constrains
operators:
- id: O-reassess
  statement: 随条件变化重新判断准备和行动。
  epistemic_status: reconstructed
  anchors:
  - BKE-conditions
  - BKE-scope
  - BKE-update
  conditions: 仅适用本合成来源的有限条件判断
  speaker: 合成论说者
  intent: 判断当前障碍
  inputs: 当前条件、已完成的检验与任务目标
  uses:
  - V-action
  - R-scope
  move: 区分未具备条件与条件已具备，再限制检验能支持的结论。
  warrant: 缺少条件时需准备，条件已具备时不能无限重复准备；有限检验只支持有限结论。
  alternatives: 也可能有另一个未提供的风险，应核对而不猜测。
  blocked_by: 条件真实性无法核实且会改变判断。
  revise_when: 新事实改变准备是否完成。
  examples:
  - EX-apply
  - EX-update
conflicts: []
core:
  include:
  - O-reassess
  text: 先看行动需要的条件是否具备。未具备时补条件；具备后不以准备无限拖延。一次局部检验只支持那个范围，新事实改变条件时重新判断，不编造未知风险。
